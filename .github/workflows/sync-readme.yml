name: Sync README

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sync-readme-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          package-manager-cache: false
          node-version: 20
      - name: Sync repository references (skip absent README)
        run: node scripts/ci/sync-readme-repository.cjs
      - name: Commit README only when changed
        run: |
          if [ ! -f README.md ] || git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs: sync README repository URLs'
          git push origin HEAD
