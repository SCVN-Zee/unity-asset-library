name: Release Stable

on:
  push:
    tags:
      - 'v*'
      - '!v*-*'

permissions:
  contents: read

concurrency:
  group: release-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Validate channel, tag, lock and repository
        env:
          RELEASE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: node scripts/ci/validate-release.cjs stable

  sync-readme:
    permissions:
      contents: write
    needs: validate
    uses: ./.github/workflows/sync-readme.yml

  release:
    permissions:
      contents: write
    needs: sync-readme
    runs-on: macos-14
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Install development dependencies
        run: npm ci
      - name: Sync release README before build
        run: node scripts/ci/sync-readme-repository.cjs
      - name: Bake release repository metadata
        run: node scripts/ci/validate-release.cjs stable --prepare
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.0'
          enable-cache: false
      - name: Run backend and desktop checks
        run: make test
      - name: Build and verify self-contained installers
        run: make pack
      - name: Preserve verified installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Publish verified release
        run: node scripts/ci/publish-release.cjs stable
